name: Normalize release header

# When something lands on main, check if the userscript header needs GreasyFork-safe fixes:
#   - force @name to "PROST" (dev branches may carry "TEST PROST")
#   - strip any prerelease suffix from @version (e.g. 0.7.8-unstable -> 0.7.8)
# GreasyFork auto-imports main's raw and refuses syncs that change @name or carry
# a prerelease version, so this guarantees released versions stay importable.
#
# Opens a PR instead of pushing directly, so the change goes through the test gate.

on:
  push:
    branches: [main]
    paths:
      - 'warera-prost.user.js'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: normalize-release-header
  cancel-in-progress: false

jobs:
  normalize:
    # Skip the bot's own merge commits to avoid infinite loops.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize @name and @version
        id: norm
        run: |
          f=warera-prost.user.js
          sed -i -E 's|^(// @name[[:space:]]+).*$|\1PROST|' "$f"
          sed -i -E 's|^(// @version[[:space:]]+[0-9]+\.[0-9]+\.[0-9]+)-[0-9A-Za-z.]+[[:space:]]*$|\1|' "$f"
          if git diff --quiet -- "$f"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Normalized header:"; grep -E '^// @(name|version)' "$f"
          fi

      - name: Create PR for normalized header
        if: steps.norm.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="chore/normalize-header-$(date +%s)"
          git config user.name "beertierchen"
          git config user.email "271843730+beertierchen@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -am "chore: normalize release header (PROST, strip prerelease)"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "chore: normalize release header" \
            --body "Auto-generated: strips TEST prefix from @name and -unstable suffix from @version for GreasyFork compatibility." \
            --base main \
            --head "$BRANCH"
